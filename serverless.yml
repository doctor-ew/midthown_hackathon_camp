service: langchain-chatbot

provider:
  name: aws
  runtime: nodejs24.x
  environment:
    OPENAI_API_KEY: ${env:OPENAI_API_KEY}
    OPENAI_MODEL: ${env:OPENAI_MODEL, 'gpt-4o'}
    TURNSTILE_SECRET_KEY: ${env:TURNSTILE_SECRET_KEY}
    TURNSTILE_HOSTNAMES: ${env:TURNSTILE_HOSTNAMES, 'doctorew.com,www.doctorew.com'}
    AI_ALLOWED_ORIGINS: ${env:AI_ALLOWED_ORIGINS, 'https://doctorew.com,https://www.doctorew.com'}
    AI_GUARD_TABLE:
      Ref: AiGuardTable
    AI_ENABLED: ${env:AI_ENABLED, 'true'}
    AI_SESSION_LIMIT: ${env:AI_SESSION_LIMIT, '30'}
    AI_MINUTE_IP_LIMIT: ${env:AI_MINUTE_IP_LIMIT, '10'}
    AI_DAILY_LIMIT: ${env:AI_DAILY_LIMIT, '300'}
    AI_MONTHLY_LIMIT: ${env:AI_MONTHLY_LIMIT, '2000'}
    AI_HOURLY_IP_LIMIT: ${env:AI_HOURLY_IP_LIMIT, '60'}
  timeout: 40
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:UpdateItem
          Resource:
            Fn::GetAtt: [AiGuardTable, Arn]
          Condition:
            ForAnyValue:StringEquals:
              dynamodb:EnclosingOperation:
                - TransactWriteItems
  stage: dev

functions:
  session:
    handler: dist/src/handler.handler
    reservedConcurrency: 2
    events:
      - http:
          path: session
          method: post
          cors: true
  chatbot:
    handler: dist/src/handler.handler
    reservedConcurrency: 2
    events:
      - http:
          path: chatbot
          method: post
          cors: true # <-- CORS!
  translation:
    handler: dist/src/handler.handler
    reservedConcurrency: 2
    events:
      - http:
          path: translation
          method: post
          cors: true # <-- CORS!
  personalAssistant:
    handler: dist/src/handler.handler
    reservedConcurrency: 2
    events:
      - http:
          path: personalAssistant
          method: post
          cors: true
  sentimentAnalysis:
    handler: dist/src/handler.handler
    reservedConcurrency: 2
    events:
      - http:
          path: sentimentAnalysis
          method: post
          cors: true # <-- CORS!
  foxtrot:
    handler: dist/src/handler.handler
    reservedConcurrency: 2
    events:
      - http:
          path: foxtrot
          method: post
          cors: true # <-- CORS!

plugins:
  - ./scripts/stage-guard.cjs
  - serverless-dotenv-plugin
  - serverless-offline
  - serverless-domain-manager

custom:
  dotenv:
    include: []
  customDomain:
    domainName: skippyts.doctorew.com
    stage: ${opt:stage, self:provider.stage}
    basePath: ""
    certificateName: "*.doctorew.com"
    createRoute53Record: true

resources:
  Resources:
    AiGuardTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true
  Outputs:
    AiGuardTableName:
      Value:
        Ref: AiGuardTable

package:
  patterns:
    - '!src/**'
    - '!test/**'
    - '!scripts/**'
    - '!*.ts'
    - '!.env*'
    - '!.claude/**'
    - '!env.example'
    - '!README.md'
    - '!SECURITY-DEPLOYMENT.md'
